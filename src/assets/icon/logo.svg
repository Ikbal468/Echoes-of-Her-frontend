<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141829" />
      <stop offset="60%" stop-color="#0a0c14" />
      <stop offset="100%" stop-color="#06070b" />
    </radialGradient>

    <!-- Neon Cyan / Indigo Gradient for Emblem -->
    <linearGradient id="cyanPurpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <linearGradient id="shieldFill" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.15)" />
      <stop offset="100%" stop-color="rgba(244, 63, 94, 0.08)" />
    </linearGradient>

    <!-- Filter for Neon Glow -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container / Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="2" />

  <!-- Outer Ambient Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="rgba(244, 63, 94, 0.08)" stroke-width="1.5" />

  <!-- Stoic Shield / Anchor Body -->
  <path d="M 256 100 
           C 345 100 375 140 375 220 
           C 375 320 285 385 256 410 
           C 227 385 137 320 137 220 
           C 137 140 167 100 256 100 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#cyanPurpleGlow)" 
        stroke-width="5" 
        filter="url(#neonBlur)" />

  <!-- Inner Hourglass / Mindful Anchor Focus Line -->
  <!-- Top Anchor Ring -->
  <circle cx="256" cy="180" r="26" fill="none" stroke="#38bdf8" stroke-width="4.5" filter="url(#subtleGlow)" />
  
  <!-- Central Fluke & Balance Beam -->
  <line x1="216" y1="230" x2="296" y2="230" stroke="#818cf8" stroke-width="4.5" stroke-linecap="round" />
  <line x1="256" y1="206" x2="256" y2="330" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

  <!-- Lower Anchor Arc -->
  <path d="M 195 285 C 205 345 307 345 317 285" fill="none" stroke="url(#cyanPurpleGlow)" stroke-width="5" stroke-linecap="round" />

  <!-- Center Core Pulsing Dot (Mindfulness Anchor) -->
  <circle cx="256" cy="265" r="7" fill="#ffffff" filter="url(#subtleGlow)" />
  <circle cx="256" cy="265" r="14" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.8" />
</svg>

